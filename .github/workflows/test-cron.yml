name: Test Cron Job

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (for testing)
  workflow_dispatch: {}  # Empty object to define manual trigger

jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - name: Print time and success message
        run: echo "The cron job is running! Current time: $(date)"
